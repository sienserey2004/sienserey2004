name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit of the `latest` branch (v3.34.0), because this
      # third-party action receives your token.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sienserey2004
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Bangkok

          # Lines added and removed, under Repositories
          plugin_lines: yes
          plugin_lines_sections: base

          # 3D contributions calendar and streak
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 8

          # Commit activity charts by time of day and day of the week
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_charts: yes
